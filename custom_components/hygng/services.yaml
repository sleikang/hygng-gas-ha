get_accounts:
  name: 查询户号
  description: 读取该 Cookie 下绑定的全部户号（对应小程序账单查询首页）。
  fields:
    entry_id:
      name: 配置项
      description: 留空则查询全部配置项。
      selector:
        config_entry:
          integration: hygng

get_bills:
  name: 查询账单列表
  description: 读取最近的气费账单列表（通常 12 个月）。
  fields:
    entry_id:
      name: 配置项
      description: 留空则查询全部配置项。
      selector:
        config_entry:
          integration: hygng
    limit:
      name: 返回条数
      description: 默认 12，最多 36 条。
      default: 12
      selector:
        number:
          min: 1
          max: 36
          mode: box

get_bill_detail:
  name: 查询账单明细
  description: 读取指定账期的抄表度数、单价、违约金、超档气费与合计应缴。
  fields:
    entry_id:
      name: 配置项
      description: 留空则查询全部配置项。
      selector:
        config_entry:
          integration: hygng
    month:
      name: 账期
      description: 格式 YYYY-MM，留空取最近一期。
      example: "2026-10"
      selector:
        text:

get_usage:
  name: 查询用气管理
  description: 读取指定账期的用气汇总与近 6 个月日均用气量。
  fields:
    entry_id:
      name: 配置项
      description: 留空则查询全部配置项。
      selector:
        config_entry:
          integration: hygng
    month:
      name: 账期
      description: 格式 YYYY-MM，留空取最近一期。
      example: "2026-10"
      selector:
        text:

get_ladder_detail:
  name: 查询阶梯用气明细
  description: 读取阶梯档位与单价说明，并给出本年度累计用气量所处档位。
  fields:
    entry_id:
      name: 配置项
      description: 留空则查询全部配置项。
      selector:
        config_entry:
          integration: hygng
    month:
      name: 账期
      description: 格式 YYYY-MM，留空取最近一期。
      example: "2026-10"
      selector:
        text:

refresh:
  name: 立即刷新
  description: 重新抓取全部页面（等价于按下设备上的「刷新账单」按钮）。
  fields:
    entry_id:
      name: 配置项
      description: 留空则刷新全部配置项。
      selector:
        config_entry:
          integration: hygng
